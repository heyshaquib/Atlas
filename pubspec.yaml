name: atlas
description: "Atlas — Premium Bookmark Manager for Android"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  hooks_riverpod: ^3.3.2
  flutter_hooks: ^0.21.3+1
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_animate: ^4.5.2
  google_fonts: ^8.2.0
  dynamic_color: ^1.7.0
  cached_network_image: ^3.4.1
  flutter_quill: ^11.5.1
  http: ^1.2.2
  html: ^0.15.5
  workmanager: ^0.9.0+3
  flutter_local_notifications: ^22.1.0
  shared_preferences: ^2.3.4
  url_launcher: ^6.3.1
  receive_sharing_intent: ^1.8.1

  flutter_staggered_grid_view: ^0.7.0
  flutter_colorpicker: ^1.1.0
  file_picker: ^8.3.7
  share_plus: ^10.1.4
  uuid: ^4.5.1
  intl: ^0.20.2
  flutter_native_splash: ^2.4.8
  image: ^4.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.14
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/icons/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icons/book_icon.png"
  min_sdk_android: 24
  adaptive_icon_background: "#1C1B2E"
  adaptive_icon_foreground: "assets/icons/book_icon.png"

flutter_native_splash:
  color: "#1C1B2E"
  image: "assets/icons/book_icon.png"
  android_12:
    color: "#1C1B2E"
    image: "assets/icons/book_icon.png"


