name: Preview Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build debug APK
    if: github.actor == github.repository_owner || github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build -d

      - name: Build debug APKs
        run: |
          flutter build apk --debug
          flutter build apk --debug --split-per-abi

      - name: Collect APKs and compute checksums
        id: apk
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short HEAD)
          SAFE_REF=$(echo "${GITHUB_REF_NAME}" | tr '/ ' '__')
          mkdir -p output_apks
          
          {
            echo "**Preview build of \`${GITHUB_REF_NAME}\`**"
            echo ""
            echo "| File | Size | SHA-256 |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Universal APK
          if [ -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
            dest="Atlas-debug-universal-${SAFE_REF}-${SHORT_SHA}.apk"
            cp "build/app/outputs/flutter-apk/app-debug.apk" "output_apks/$dest"
            size=$(du -h "output_apks/$dest" | cut -f1)
            sha256=$(sha256sum "output_apks/$dest" | awk '{print $1}')
            echo "| \`${dest}\` | ${size} | \`${sha256}\` |" >> "$GITHUB_STEP_SUMMARY"
          fi
          
          # Split APKs
          shopt -s nullglob
          for apk in build/app/outputs/flutter-apk/app-*-debug.apk; do
            filename=$(basename "$apk")
            abi=$(echo "$filename" | sed 's/^app-\(.*\)-debug\.apk$/\1/')
            dest="Atlas-debug-$abi-${SAFE_REF}-${SHORT_SHA}.apk"
            cp "$apk" "output_apks/$dest"
            size=$(du -h "output_apks/$dest" | cut -f1)
            sha256=$(sha256sum "output_apks/$dest" | awk '{print $1}')
            echo "| \`${dest}\` | ${size} | \`${sha256}\` |" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "artifact_name=Atlas-debug-${SAFE_REF}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload APKs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.artifact_name }}
          path: output_apks/*.apk
          if-no-files-found: error
          retention-days: 30
